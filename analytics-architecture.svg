<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Orbit analytics data flow</title><desc id="desc">Read-only exchange and wallet data goes through validation and explicit review into account-scoped records. Observed valuations and verified public market data feed separate analytics.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b98bd"/></marker></defs><rect width="1120" height="520" rx="24" fill="#101a2b"/><g fill="#f1f5fb" font-family="Arial,sans-serif"><text x="34" y="45" font-size="25" font-weight="bold">How Orbit turns data into analytics</text><text x="34" y="74" font-size="14" fill="#b9c9df">Account records and public market observations remain separate until identity and coverage are verified.</text></g><g stroke="#456286" fill="#192c46"><rect x="34" y="110" width="205" height="100" rx="12"/><rect x="300" y="110" width="205" height="100" rx="12"/><rect x="566" y="110" width="205" height="100" rx="12"/><rect x="832" y="110" width="254" height="100" rx="12"/><rect x="34" y="310" width="205" height="100" rx="12"/><rect x="300" y="310" width="205" height="100" rx="12"/><rect x="566" y="310" width="205" height="100" rx="12"/><rect x="832" y="310" width="254" height="100" rx="12"/></g><g fill="#f1f5fb" font-family="Arial,sans-serif" font-size="17" font-weight="bold"><text x="50" y="141">Wallets &amp; exchanges</text><text x="316" y="141">Validate &amp; normalize</text><text x="582" y="141">Review &amp; confirm</text><text x="848" y="141">Account ledger</text><text x="50" y="341">Public market feeds</text><text x="316" y="341">Bounded cache</text><text x="582" y="341">Observed snapshots</text><text x="848" y="341">Analytics workspace</text></g><g fill="#b9c9df" font-family="Arial,sans-serif" font-size="14"><text x="50" y="169">Read-only API / address</text><text x="50" y="192">Credentials stay on server</text><text x="316" y="169">Identity, amounts, timestamps</text><text x="316" y="192">Reject unknown fee values</text><text x="582" y="169">Duplicates, costs, transfers</text><text x="582" y="192">No automatic invented trades</text><text x="848" y="169">User-scoped records &amp; fees</text><text x="848" y="192">Weighted-average accounting</text><text x="50" y="369">Prices, executions, funding</text><text x="50" y="392">Source and coverage labels</text><text x="316" y="369">Rate limits and timeouts</text><text x="316" y="392">Unavailable stays unavailable</text><text x="582" y="369">Saved values, actual dates</text><text x="582" y="392">Missing history stays a gap</text><text x="848" y="369">P&amp;L / portfolio / research</text><text x="848" y="392">One tool loaded at a time</text></g><g stroke="#7b98bd" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M239 160H294"/><path d="M505 160H560"/><path d="M771 160H826"/><path d="M239 360H294"/><path d="M505 360H560"/><path d="M771 360H826"/><path d="M959 210V304"/><path d="M136 210V260H668V304"/></g><text x="34" y="475" font-family="Arial,sans-serif" font-size="15" fill="#a7d9ca">No orders are placed. Value changes, cash-flow-adjusted returns, and realized P&amp;L have different meanings.</text></svg>