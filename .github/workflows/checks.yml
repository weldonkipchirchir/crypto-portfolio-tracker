name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orbit_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ORBIT_TEST_DATABASE_URL: postgresql://orbit_test:disposable_test_password@127.0.0.1:5432/orbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -q
      - run: node test_ui.cjs
      - run: node advanced_dashboard.test.cjs
      - run: node target_dashboard.test.cjs
      - run: node market_dashboard.test.cjs
      - run: node market_intelligence.test.cjs
      - run: node chart_tools.test.cjs
      - run: node experience_ui.test.cjs
      - run: node coin_alerts.test.cjs
      - run: node pine_bridge.test.cjs
      - run: node pine_editor.test.cjs
